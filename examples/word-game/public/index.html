<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Game</title>
<style>
  /* No frameworks, no build step. Open the file and it works. */
  :root { --ink: #1d0b33; --paper: #fff3d6; --accent: #ff8a00; --muted: #6b5b8a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px;
  }
  .card {
    width: min(520px, 100%); background: #2a1150;
    border: 4px solid var(--accent); border-radius: 12px; padding: 28px;
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -0.5px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 0.85rem; }
  .clue {
    background: var(--paper); color: var(--ink); border-radius: 8px;
    padding: 16px; margin-bottom: 8px; font-size: 1.05rem; font-weight: 600;
  }
  .meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px; font-size: 1rem; border-radius: 8px;
    border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
    font-weight: 600;
  }
  button {
    padding: 12px 18px; font-size: 0.9rem; font-weight: 800; letter-spacing: 0.5px;
    border-radius: 8px; border: 3px solid var(--ink); background: var(--accent);
    color: var(--ink); cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .result { margin-top: 16px; font-weight: 700; min-height: 1.5em; }
  .win { color: #6ee7a0; }
  .miss { color: #ff9d9d; }
  .note { margin-top: 20px; color: var(--muted); font-size: 0.75rem; }
  code { background: #1d0b33; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Word Game</h1>
    <p class="sub">Read the clue. Guess the word. That is the whole game.</p>

    <div class="clue" id="clue">Loading…</div>
    <div class="meta" id="meta"></div>

    <div class="row">
      <input id="guess" placeholder="your guess" autocomplete="off" autocapitalize="off" />
      <button id="go">GUESS</button>
    </div>

    <div class="result" id="result"></div>
    <button id="again" style="margin-top:16px;display:none;background:var(--paper)">NEW WORD</button>

    <p class="note" id="note"></p>
  </div>

<script>
  /**
   * The page holds no secret.
   *
   * There is no API key here, and no answer either - the secret word stays on the
   * server until you get it. Open the developer tools and look: everything this page
   * knows is a clue and a number of letters.
   *
   * That is the point of the example. A game that puts the answer in the page is the
   * same mistake as putting the key there.
   */

  const clueEl = document.getElementById('clue')
  const metaEl = document.getElementById('meta')
  const guessEl = document.getElementById('guess')
  const goEl = document.getElementById('go')
  const againEl = document.getElementById('again')
  const resultEl = document.getElementById('result')
  const noteEl = document.getElementById('note')

  async function newGame() {
    resultEl.textContent = ''
    resultEl.className = 'result'
    againEl.style.display = 'none'
    goEl.disabled = true
    clueEl.textContent = 'Loading…'
    metaEl.textContent = ''

    try {
      const res = await fetch('/api/new')
      const data = await res.json()
      clueEl.textContent = data.clue
      metaEl.textContent = `${data.letters} letters`
      // Say where the clue came from. A game using a model should be honest about it.
      noteEl.textContent = data.fromModel
        ? 'This clue was written by a model. The answer is checked by code, not by the model.'
        : 'No model was available, so this is a built-in clue. Start one (see lesson 2) and the clues get better.'
      guessEl.value = ''
      guessEl.focus()
    } catch {
      clueEl.textContent = 'Could not reach the server.'
      metaEl.textContent = ''
    } finally {
      goEl.disabled = false
    }
  }

  async function submitGuess() {
    const guess = guessEl.value.trim()
    if (!guess) return
    goEl.disabled = true

    try {
      const res = await fetch('/api/guess', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guess }),
      })
      const data = await res.json()

      if (data.correct) {
        resultEl.textContent = `Correct — ${data.word} in ${data.guesses} ${data.guesses === 1 ? 'guess' : 'guesses'}.`
        resultEl.className = 'result win'
        againEl.style.display = 'inline-block'
        guessEl.value = ''
      } else {
        resultEl.textContent = `Not it. ${data.guesses} ${data.guesses === 1 ? 'guess' : 'guesses'} so far.`
        resultEl.className = 'result miss'
        guessEl.select()
      }
    } catch {
      resultEl.textContent = 'Could not reach the server.'
      resultEl.className = 'result miss'
    } finally {
      goEl.disabled = false
    }
  }

  goEl.addEventListener('click', submitGuess)
  againEl.addEventListener('click', newGame)
  guessEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitGuess() })

  newGame()
</script>
</body>
</html>
